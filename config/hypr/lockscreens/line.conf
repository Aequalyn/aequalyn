# Aequalyn lock screen: Line. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    color = rgba({{BG}}ff)
}

shape {
    monitor =
    size = 300, 2
    color = rgba({{ACCENT}}ff)
    rounding = 0
    border_size = 0
    position = 0, -32
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M  ·  %A, %-d %B"
    font_size = 13
    font_family = $font
    color = rgba({{MUTED}}ff)
    position = 0, -60
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 300, 44
    rounding = 0
    outline_thickness = 0
    inner_color = rgba({{BG}}ff)
    outer_color = rgba({{BG}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, 0
    halign = center
    valign = center
}
