# Aequalyn lock screen: Split. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 0
    brightness = 0.85
}

shape {
    monitor =
    size = 34%, 100%
    color = rgba({{BG}}f2)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 80
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 8%, 120
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 15
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = 8.4%, 50
    halign = left
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    font_size = 13
    font_family = $font
    color = rgba({{MUTED}}ff)
    position = 8.4%, -10
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    rounding = 10
    outline_thickness = 1
    inner_color = rgba({{SURFACE}}ff)
    outer_color = rgba({{BORDER}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 8%, -80
    halign = left
    valign = center
}
