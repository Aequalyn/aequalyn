# Aequalyn lock screen: Weather. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 88
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:600000] ~/.local/bin/aequalyn-lock-info weather
    font_size = 20
    font_family = $font
    color = rgba({{TEXT}}ee)
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 12
    font_family = $font
    color = rgba({{TEXT}}aa)
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    rounding = 22
    outline_thickness = 1
    inner_color = rgba({{BG}}aa)
    outer_color = rgba({{ACCENT}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -60
    halign = center
    valign = center
}
