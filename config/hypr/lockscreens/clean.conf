# Aequalyn lock screen: Clean. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 3
    blur_size = 7
    brightness = 0.7
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 72
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 15
    font_family = $font
    color = rgba({{TEXT}}cc)
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 46
    rounding = 23
    outline_thickness = 2
    inner_color = rgba({{SURFACE}}cc)
    outer_color = rgba({{ACCENT}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -60
    halign = center
    valign = center
}
