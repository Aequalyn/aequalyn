# Aequalyn lock screen: Stack. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
}

label {
    monitor =
    text = cmd[update:1000] date +"%H"
    font_size = 110
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%M"
    font_size = 110
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 40
    rounding = 20
    outline_thickness = 1
    inner_color = rgba({{BG}}aa)
    outer_color = rgba({{TEXT}}55)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = 
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -100
    halign = center
    valign = center
}
