# Aequalyn lock screen: Pill. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 2
    blur_size = 6
    brightness = 0.65
}

shape {
    monitor =
    size = 440, 70
    color = rgba({{SURFACE}}e6)
    rounding = -1
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 26
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = -130, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 46
    rounding = -1
    outline_thickness = 0
    inner_color = rgba({{BG}}ff)
    outer_color = rgba({{BG}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 75, 0
    halign = center
    valign = center
}
