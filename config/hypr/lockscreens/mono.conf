# Aequalyn lock screen: Mono. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    color = rgba({{BG}}ff)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 120
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 13
    font_family = $font
    color = rgba({{MUTED}}ff)
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 220, 40
    rounding = 8
    outline_thickness = 1
    inner_color = rgba({{BG}}ff)
    outer_color = rgba({{MUTED}}88)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = 
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, 80
    halign = center
    valign = bottom
}
