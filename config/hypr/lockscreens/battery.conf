# Aequalyn lock screen: Battery. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    color = rgba({{BG}}ff)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 72
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:20000] ~/.local/bin/aequalyn-lock-info battery
    font_size = 18
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = 0, 55
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "up $(uptime -p | sed "s/up //")"
    font_size = 11
    font_family = $font
    color = rgba({{MUTED}}ff)
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 42
    rounding = 8
    outline_thickness = 1
    inner_color = rgba({{SURFACE}}ff)
    outer_color = rgba({{BORDER}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -60
    halign = center
    valign = center
}
