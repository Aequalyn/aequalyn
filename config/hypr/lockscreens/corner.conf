# Aequalyn lock screen: Corner. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 0
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 64
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 60, 110
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 14
    font_family = $font
    color = rgba({{TEXT}}cc)
    position = 64, 70
    halign = left
    valign = bottom
}

input-field {
    monitor =
    size = 240, 44
    rounding = 10
    outline_thickness = 2
    inner_color = rgba({{SURFACE}}dd)
    outer_color = rgba({{ACCENT}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = -60, 70
    halign = right
    valign = bottom
}
