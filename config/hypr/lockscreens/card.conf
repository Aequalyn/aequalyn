# Aequalyn lock screen: Card. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 1
    blur_size = 4
    brightness = 0.7
}

shape {
    monitor =
    size = 420, 150
    color = rgba({{BG}}ee)
    rounding = 18
    border_size = 1
    border_color = rgba({{BORDER}}ff)
    position = 0, 80
    halign = center
    valign = bottom
}

image {
    monitor =
    path = ~/.face
    size = 72
    rounding = -1
    border_size = 2
    border_color = rgba({{ACCENT}}ff)
    position = -140, 120
    halign = center
    valign = bottom
}

label {
    monitor =
    text = <b>$USER</b>
    font_size = 15
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = -30, 175
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 12
    font_family = $font
    color = rgba({{MUTED}}ff)
    position = 120, 175
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 280, 40
    rounding = 10
    outline_thickness = 0
    inner_color = rgba({{SURFACE}}ff)
    outer_color = rgba({{SURFACE}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 40, 105
    halign = center
    valign = bottom
}
