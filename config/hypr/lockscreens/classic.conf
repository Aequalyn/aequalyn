# Aequalyn lock screen: Classic. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = false
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 220, 50
    outline_thickness = 2
    rounding = 12
    inner_color = rgba({{SURFACE}}ff)
    outer_color = rgba({{ACCENT}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_spacing = 0.4
    dots_size = 0.2
    dots_center = true
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 22
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 200
    halign = center
    valign = center
}
