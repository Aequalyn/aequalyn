# Aequalyn lock screen: Neon. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    color = rgba({{BG}}ff)
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 96
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba({{ACCENT}}cc)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 14
    font_family = $font
    color = rgba({{ACCENT2}}ff)
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba({{ACCENT2}}99)
}

input-field {
    monitor =
    size = 260, 46
    rounding = 23
    outline_thickness = 3
    inner_color = rgba({{BG}}ff)
    outer_color = rgba({{ACCENT}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -70
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba({{ACCENT}}cc)
}
