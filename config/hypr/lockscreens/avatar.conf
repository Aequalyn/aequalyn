# Aequalyn lock screen: Avatar. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 4
    blur_size = 9
    brightness = 0.5
}

image {
    monitor =
    path = ~/.face
    size = 150
    rounding = -1
    border_size = 3
    border_color = rgba({{ACCENT}}ff) rgba({{ACCENT2}}ff) 45deg
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>$USER</b>
    font_size = 22
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M  ·  %a %-d %b"
    font_size = 12
    font_family = $font
    color = rgba({{TEXT}}aa)
    position = 0, -15
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 42
    rounding = -1
    outline_thickness = 1
    inner_color = rgba({{BG}}aa)
    outer_color = rgba({{TEXT}}33)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -75
    halign = center
    valign = center
}
