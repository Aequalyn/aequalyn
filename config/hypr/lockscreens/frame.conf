# Aequalyn lock screen: Frame. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 1
    blur_size = 4
    brightness = 0.7
}

shape {
    monitor =
    size = 96%, 92%
    color = rgba(00000000)
    rounding = 24
    border_size = 2
    border_color = rgba({{ACCENT}}cc)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 40
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, -70
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 13
    font_family = $font
    color = rgba({{TEXT}}bb)
    position = 0, -130
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 240, 44
    rounding = 22
    outline_thickness = 2
    inner_color = rgba({{BG}}cc)
    outer_color = rgba({{ACCENT}}cc)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, 90
    halign = center
    valign = bottom
}
