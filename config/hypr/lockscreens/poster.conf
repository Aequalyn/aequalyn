# Aequalyn lock screen: Poster. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 2
    blur_size = 6
    brightness = 0.45
}

label {
    monitor =
    text = cmd[update:60000] date +"%A" | tr a-z A-Z
    font_size = 180
    font_family = $font
    color = rgba({{TEXT}}22)
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 44
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%-d %B %Y"
    font_size = 13
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 42
    rounding = 21
    outline_thickness = 1
    inner_color = rgba({{BG}}cc)
    outer_color = rgba({{TEXT}}44)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, 90
    halign = center
    valign = bottom
}
