# Aequalyn lock screen: Calendar. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 4
    blur_size = 9
    brightness = 0.45
}

shape {
    monitor =
    size = 640, 330
    color = rgba({{BG}}dd)
    rounding = 20
    border_size = 1
    border_color = rgba({{BORDER}}ff)
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 56
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = -140, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 12
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = -140, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] cal -m | sed -e "s/&/\&amp;/g"
    font_size = 12
    font_family = $font
    color = rgba({{TEXT}}cc)
    position = 150, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 42
    rounding = 10
    outline_thickness = 1
    inner_color = rgba({{SURFACE}}ff)
    outer_color = rgba({{ACCENT}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = -140, -50
    halign = center
    valign = center
}
