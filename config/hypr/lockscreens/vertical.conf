# Aequalyn lock screen: Vertical. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 0
    blur_size = 0
    brightness = 0.6
}

shape {
    monitor =
    size = 160, 100%
    color = rgba({{BG}}e6)
    rounding = 0
    border_size = 0
    border_color = rgba(00000000)
    position = 0, 0
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 72
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 45, 0
    halign = left
    valign = center
    rotate = 90
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %-d"
    font_size = 14
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = 40, 40
    halign = left
    valign = bottom
}

input-field {
    monitor =
    size = 260, 44
    rounding = 10
    outline_thickness = 2
    inner_color = rgba({{BG}}dd)
    outer_color = rgba({{ACCENT}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = -60, 60
    halign = right
    valign = bottom
}
