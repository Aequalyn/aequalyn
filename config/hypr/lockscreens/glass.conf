# Aequalyn lock screen: Glass. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 4
    blur_size = 9
    brightness = 0.8
}

shape {
    monitor =
    size = 360, 300
    color = rgba({{SURFACE}}99)
    rounding = 24
    border_size = 1
    border_color = rgba({{TEXT}}22)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 56
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 13
    font_family = $font
    color = rgba({{TEXT}}bb)
    position = 0, 15
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    rounding = 12
    outline_thickness = 1
    inner_color = rgba({{BG}}aa)
    outer_color = rgba({{ACCENT}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -70
    halign = center
    valign = center
}
