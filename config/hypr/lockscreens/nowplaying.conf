# Aequalyn lock screen: Now playing. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
# The song comes from ~/.local/bin/aequalyn-lock-media (its cover, title and artist, escaped);
# with nothing playing those lines stay empty and the clock is all there is.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 5
    blur_size = 10
    brightness = 0.4
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 28
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, -60
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 12
    font_family = $font
    color = rgba({{TEXT}}aa)
    position = 0, -105
    halign = center
    valign = top
}

image {
    monitor =
    path =
    reload_time = 3
    reload_cmd = ~/.local/bin/aequalyn-lock-media cover
    size = 240
    rounding = 18
    border_size = 2
    border_color = rgba({{ACCENT}}cc)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3000] ~/.local/bin/aequalyn-lock-media state
    font_size = 11
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3000] ~/.local/bin/aequalyn-lock-media title
    font_size = 18
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, -65
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3000] ~/.local/bin/aequalyn-lock-media artist
    font_size = 12
    font_family = $font
    color = rgba({{TEXT}}aa)
    position = 0, -95
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    rounding = 22
    outline_thickness = 1
    inner_color = rgba({{BG}}99)
    outer_color = rgba({{TEXT}}33)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, 80
    halign = center
    valign = bottom
}
