# Aequalyn lock screen: Now playing. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 5
    blur_size = 10
    brightness = 0.4
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 110
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000088)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 14
    font_family = $font
    color = rgba({{TEXT}}cc)
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 240, 44
    rounding = 22
    outline_thickness = 1
    inner_color = rgba({{BG}}99)
    outer_color = rgba({{TEXT}}33)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3000] playerctl metadata --format "{{ title }}" 2>/dev/null
    font_size = 18
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = 0, 110
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3000] playerctl metadata --format "{{ artist }}" 2>/dev/null
    font_size = 12
    font_family = $font
    color = rgba({{TEXT}}aa)
    position = 0, 80
    halign = center
    valign = bottom
}
