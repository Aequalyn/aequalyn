# Aequalyn lock screen: Dashboard. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 80
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 14
    font_family = $font
    color = rgba({{TEXT}}cc)
    position = 0, 110
    halign = center
    valign = center
}

shape {
    monitor =
    size = 520, 56
    color = rgba({{SURFACE}}cc)
    rounding = 14
    border_size = 0
    border_color = rgba(00000000)
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] b=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1); echo "󰁹 ${b:-–}%    󰔛 $(uptime -p | sed "s/up //")"
    font_size = 12
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] playerctl metadata --format "󰎆  {{ artist }} – {{ title }}" 2>/dev/null
    font_size = 12
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    rounding = 12
    outline_thickness = 2
    inner_color = rgba({{BG}}cc)
    outer_color = rgba({{ACCENT}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -90
    halign = center
    valign = center
}
