# Aequalyn lock screen: Dot. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    color = rgba({{BG}}ff)
}

label {
    monitor =
    text = Hi, $USER
    font_size = 16
    font_family = $font
    color = rgba({{MUTED}}ff)
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 180, 36
    rounding = -1
    outline_thickness = 0
    inner_color = rgba({{BG}}ff)
    outer_color = rgba({{BG}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = 
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -10
    halign = center
    valign = center
}
