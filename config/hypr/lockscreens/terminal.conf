# Aequalyn lock screen: Terminal. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    color = rgba({{BG}}ff)
}

label {
    monitor =
    text = cmd[update:1000] date +"[%H:%M:%S]"
    font_size = 14
    font_family = $font
    color = rgba({{MUTED}}ff)
    position = 80, -80
    halign = left
    valign = top
}

label {
    monitor =
    text = <span foreground="#{{ACCENT}}">$USER</span>@aequalyn <span foreground="#{{MUTED}}">~</span> $ unlock
    font_size = 16
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 80, -120
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "last seen $(date +"%a %d %b, %H:%M")"
    font_size = 12
    font_family = $font
    color = rgba({{MUTED}}ff)
    position = 80, -155
    halign = left
    valign = top
}

input-field {
    monitor =
    size = 420, 36
    rounding = 0
    outline_thickness = 0
    inner_color = rgba({{BG}}ff)
    outer_color = rgba({{BG}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = <span foreground="#{{ACCENT}}">password:</span>
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 80, -200
    halign = left
    valign = top
    dots_center = false
    swap_font_color = false
}
