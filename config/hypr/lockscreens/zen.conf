# Aequalyn lock screen: Zen. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 4
    blur_size = 10
    brightness = 0.75
}

label {
    monitor =
    text = cmd[update:60000] h=$(date +%H); if [ $h -lt 5 ]; then echo "Rest well, $USER"; elif [ $h -lt 12 ]; then echo "Good morning, $USER"; elif [ $h -lt 18 ]; then echo "Good afternoon, $USER"; else echo "Good evening, $USER"; fi
    font_size = 30
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M  ·  %A"
    font_size = 12
    font_family = $font
    color = rgba({{TEXT}}aa)
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 220, 40
    rounding = 20
    outline_thickness = 0
    inner_color = rgba({{TEXT}}22)
    outer_color = rgba({{TEXT}}00)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Breathe, then type
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -50
    halign = center
    valign = center
}
