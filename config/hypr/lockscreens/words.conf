# Aequalyn lock screen: Words. A template: aequalyn-lockscreen fills in the colours of the
# current theme and the wallpaper, and writes ~/.config/hypr/hyprlock.conf.
$font = {{FONT}}

general {
    hide_cursor = true
}

animations {
    enabled = true
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = {{WALL}}
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
}

label {
    monitor =
    text = cmd[update:5000] ~/.local/bin/aequalyn-lock-info words
    font_size = 54
    font_family = $font
    color = rgba({{TEXT}}ff)
    position = 100, 60
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_size = 15
    font_family = $font
    color = rgba({{ACCENT}}ff)
    position = 104, -10
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    rounding = 10
    outline_thickness = 2
    inner_color = rgba({{BG}}cc)
    outer_color = rgba({{ACCENT}}ff)
    check_color = rgba({{ACCENT2}}ff)
    fail_color = rgba({{RED}}ff)
    font_color = rgba({{TEXT}}ff)
    font_family = $font
    placeholder_text = Password
    fail_text = Try again
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 100, -80
    halign = left
    valign = center
}
