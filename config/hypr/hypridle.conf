# Fallback idle config, only used if hypridle is started by hand.
# Aequalyn itself starts `hypridle -c ~/.config/aequalyn/hypridle.conf`, generated by
# `aequalyn-idle` from Settings -> Power. Edit the settings, not this file.
#
# `hyprctl dispatch` does not work with Hyprland 0.57's Lua config; use the
# aequalyn-dpms / aequalyn-repaint helpers instead.
general {
    lock_cmd = aequalyn-lock lock
    unlock_cmd = aequalyn-lock wake
    before_sleep_cmd = aequalyn-lock lockForSleep; aequalyn-lock wait-secure 12
    after_sleep_cmd = aequalyn-lock wake
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300
    on-timeout = aequalyn-lock lock
}

listener {
    timeout = 360
    on-timeout = aequalyn-dpms off
    on-resume = aequalyn-dpms on
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
